<script>
  (() => {
    const connection = navigator.connection;
    if (
      location.protocol !== "http:" && location.protocol !== "https:" ||
      connection?.saveData ||
      ["slow-2g", "2g"].includes(connection?.effectiveType)
    ) return;

    const prefetched = new Set();

    const prefetchUrl = (url) => {
      if (
        url.origin !== location.origin ||
        !url.pathname.endsWith(".html") ||
        url.pathname === location.pathname ||
        prefetched.has(url.href)
      ) return;

      const hint = document.createElement("link");
      hint.rel = "prefetch";
      hint.href = url.href;
      document.head.append(hint);
      prefetched.add(url.href);
    };

    const prefetchPage = (event) => {
      const link = event.target.closest("a[href]");
      if (!link || link.target || link.hasAttribute("download")) return;

      const url = new URL(link.href, location.href);
      url.hash = "";
      prefetchUrl(url);
    };

    const prefetchSitePages = async () => {
      if (document.visibilityState !== "visible") return;

      const sitemapUrl = new URL("/sitemap.xml", location.origin);
      const response = await fetch(sitemapUrl);
      if (!response.ok) {
        throw new Error(`Could not load sitemap: ${response.status}`);
      }

      const sitemap = new DOMParser().parseFromString(
        await response.text(),
        "application/xml"
      );
      sitemap.querySelectorAll("loc").forEach((locationElement) => {
        prefetchUrl(new URL(locationElement.textContent, location.origin));
      });
    };

    const scheduleSitePrefetch = () => {
      const schedule = window.requestIdleCallback || ((callback) => {
        window.setTimeout(callback, 1000);
      });
      schedule(() => {
        prefetchSitePages().catch((error) => {
          console.warn("Background page prefetch failed.", error);
        });
      }, { timeout: 3000 });
    };

    document.addEventListener("pointerover", prefetchPage, { passive: true });
    document.addEventListener("focusin", prefetchPage);
    window.addEventListener("load", scheduleSitePrefetch, { once: true });
  })();
</script>
